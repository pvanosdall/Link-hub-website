<body data-page="contact" data-root="../">
<header class="topbar shadow-text">
  <a class="me" href="../"><img src="../img/peter.jpg" alt="" width="400" height="400"><span>Peter Vanosdall</span></a>
  <nav aria-label="Site"><a href="../sell/">Sell</a><a href="../about/">About</a><a href="../contact/" aria-current="page">Contact</a></nav>
</header>
<main class="wrap wrap--page">
  <section class="hero hero--short shadow-text">
    <h1>Let's talk</h1>
    <p class="lede">Buying, selling, or just curious about the market. Send me a note and I'll get back to you.</p>
  </section>

  <section class="paper" aria-label="Contact form">
    <form class="f" data-form="contact" data-success="Thanks for reaching out. I'll get back to you soon." novalidate>
      <div class="fld"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
      <div class="fld"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
      <div class="fld"><label for="c-phone">Phone <span class="opt">(optional)</span></label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="fld"><label for="c-interest">I'm interested in</label>
        <select id="c-interest" name="interest">
          <option>Buying a home</option>
          <option>Selling a home</option>
          <option>Buying and selling</option>
          <option>Moving to Oahu</option>
          <option>Just a question</option>
        </select></div>
      <div class="fld fld--full"><label for="c-message">Message</label><textarea id="c-message" name="message" placeholder="What can I help with?" required></textarea></div>
      <div class="hp" aria-hidden="true"><label for="c-website">Website</label><input id="c-website" name="website" tabindex="-1" autocomplete="off"></div>
      <p class="form-msg" role="status" hidden></p>
      <div class="form-end">
        <button class="btn btn--ocean" type="submit">Send message</button>
        <span class="small">Your info goes only to me.</span>
      </div>
    </form>
  </section>
